<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your cart – Java Books</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cart.css">
</head>
<body>

<header class="site-header">
  <a class="logo" href="index.html" aria-label="Java Books home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5C10 4 7 3.5 2 3.5v15c5 0 8 .5 10 2 2-1.5 5-2 10-2v-15c-5 0-8 .5-10 2zM4 5.6c3.6.2 5.8.8 7 1.8v10.5c-1.4-.8-3.4-1.3-7-1.6zm16 0v10.7c-3.6.3-5.6.8-7 1.6V7.4c1.2-1 3.4-1.6 7-1.8z"/></svg>
    <span>JAVA BOOKS</span>
  </a>

  <form class="search" role="search" action="#">
    <label class="visually-hidden" for="q">Search books</label>
    <input id="q" type="search" name="q">
    <button type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </form>

  <a class="icon-link" href="account.html" aria-label="Account">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="5"/><path d="M1.5 23c0-6 4.5-9 10.5-9s10.5 3 10.5 9z"/></svg>
  </a>
  <a class="icon-link" href="cart.html" aria-label="Cart">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 2h4l3 14h12l2.5-10H6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="10" cy="21" r="1.8"/><circle cx="18" cy="21" r="1.8"/></svg>
  </a>
</header>

<main class="cart">
  <div class="table-wrap">
    <table class="cart-table">
      <caption class="visually-hidden">Items in your cart</caption>
      <thead>
        <tr>
          <th scope="col"><span class="visually-hidden">Book</span></th>
          <th scope="col" class="col-price">PRICE</th>
          <th scope="col" class="col-amount">AMOUNT</th>
          <th scope="col" class="col-subtotal">SUBTOTAL</th>
          <th scope="col"><span class="visually-hidden">Remove</span></th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>
            <div class="book">
              <a href="product.html"><img class="cover middlemarch" src="assets/middlemarch.png" alt="Middlemarch cover"></a>
              <div>
                <p class="title">MIDDLEMARCH</p>
                <p class="author">George Eliot</p>
              </div>
            </div>
          </td>
          <td class="col-price big">€ 10</td>
          <td class="col-amount"><input class="qty" type="number" min="1" value="1" aria-label="Amount of Middlemarch"></td>
          <td class="col-subtotal big">€ 10</td>
          <td class="col-remove">
            <button type="button" class="trash" aria-label="Remove Middlemarch">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6l1 2h5v2H3V4h5zM5 8h14l-1.200 14H6.200zm4 2v10h2V10zm4 0v10h2V10z"/></svg>
            </button>
          </td>
        </tr>

        <tr>
          <td>
            <div class="book">
              <a href="#"><img class="cover ulysses" src="assets/ulysses.png" alt="Ulysses cover"></a>
              <div>
                <p class="title">ULYSSES</p>
                <p class="author">James Joyce</p>
              </div>
            </div>
          </td>
          <td class="col-price big">€ 15</td>
          <td class="col-amount"><input class="qty" type="number" min="1" value="2" aria-label="Amount of Ulysses"></td>
          <td class="col-subtotal big">€ 30</td>
          <td class="col-remove">
            <button type="button" class="trash" aria-label="Remove Ulysses">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6l1 2h5v2H3V4h5zM5 8h14l-1.200 14H6.200zm4 2v10h2V10zm4 0v10h2V10z"/></svg>
            </button>
          </td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td><a class="go-back" href="index.html">GO BACK</a></td>
          <th scope="row" class="col-price total-label">TOTAL PRICE</th>
          <td class="col-amount total-value">€ 40</td>
          <td class="col-subtotal"><button type="button" class="pay">PAY</button></td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>
</main>

<footer class="site-footer">
  <nav aria-label="Footer">
    <a href="#">STORES</a>
    <a href="#">CUSTOMER SERVICE</a>
    <a href="#">ABOUT</a>
  </nav>
  <div class="social">
    <a href="#" aria-label="Facebook">
      <svg viewBox="0 0 24 24"><path d="M14 8V6c0-1 .3-1.5 1.7-1.5H18V1h-3.2C11.2 1 9.5 3 9.5 5.8V8H7v3.5h2.5V23H14V11.5h3.6L18 8z"/></svg>
    </a>
    <a href="#" aria-label="Instagram">
      <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5.5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="17.8" cy="6.2" r="1.3"/></svg>
    </a>
    <a href="#" aria-label="YouTube">
      <svg viewBox="0 0 24 24"><path d="M23 7.2c-.3-1.1-1-1.8-2.1-2C19 4.7 12 4.7 12 4.7s-7 0-8.9.5c-1.1.3-1.8 1-2.1 2C.5 9.1.5 12 .5 12s0 2.9.5 4.8c.3 1.1 1 1.8 2.1 2 1.9.5 8.9.5 8.9.5s7 0 8.9-.5c1.1-.3 1.8-1 2.1-2 .5-1.9.5-4.8.5-4.8s0-2.9-.5-4.8zM9.7 15.2V8.8l5.8 3.2z"/></svg>
    </a>
  </div>
</footer>

</body>
</html>
